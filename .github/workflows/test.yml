name: test

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  schedule:
    - cron: "0 10 * * 5" # JST 19:00 (Fri)

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
        id: go

      - name: Run test
        run: |
          set -xe
          go test
          go test -race
        env:
          TEST_CHATWORK_API_TOKEN: ${{ secrets.TEST_CHATWORK_API_TOKEN }}
          TEST_CHATWORK_ROOM_ID:   ${{ secrets.TEST_CHATWORK_ROOM_ID }}
          TEST_SLACK_API_TOKEN:    ${{ secrets.TEST_SLACK_API_TOKEN }}
          TEST_SLACK_CHANNEL:      ${{ secrets.TEST_SLACK_CHANNEL }}
          TEST_SLACK_USER_NAME:    ${{ secrets.TEST_SLACK_USER_NAME }}
          TEST_SLACK_WEBHOOK:      ${{ secrets.TEST_SLACK_WEBHOOK }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version

      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: "go.mod"
          repo-checkout: "false"

      - name: Slack Notification
        uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2.2.0
        if: always()
        continue-on-error: true
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
